[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forza-telemetry-helper"
version = "0.5.0"
description = "AI-assisted tuning advisor for Forza Horizon 6: reads the game's UDP Data Out telemetry stream and turns it into data-driven car setup suggestions."
readme = "README.md"
license = "MIT"
authors = [{ name = "Forza-Telemetry-Helper contributors" }]
requires-python = ">=3.10"
keywords = ["forza", "forza-horizon", "telemetry", "sim-racing", "tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fth = "fth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
